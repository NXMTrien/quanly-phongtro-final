name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            quanly-phongtro-client/package-lock.json
            quanly-phongtro-server/package-lock.json

      - name: Build frontend
        working-directory: quanly-phongtro-client
        run: |
          npm ci
          npm run build

      - name: Prepare backend artifact
        shell: bash
        working-directory: quanly-phongtro-server
        run: |
          set -e
          npm ci
          rm -rf dist
          mkdir -p dist/backend
          cp package.json package-lock.json index.js dist/backend/
          if [ -f .env ]; then cp .env dist/backend/; fi
          cp -R src dist/backend/
          if [ -d uploads ]; then cp -R uploads dist/backend/; fi
          test -d dist/backend/src

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            set -e
            mkdir -p /var/www/quanly-phongtro
            rm -rf /var/www/quanly-phongtro/client
            rm -rf /var/www/quanly-phongtro/server
            mkdir -p /var/www/quanly-phongtro/client /var/www/quanly-phongtro/server
            echo "Deployment placeholder for quanly-phongtro"
